<div class="results-table-wrapper" dir="rtl">

  <!-- Truncation banner (Requirement 5.8) -->
  @if (results().isTruncated) {
    <div class="truncation-banner" role="alert" aria-live="polite">
      <mat-icon>warning</mat-icon>
      <span>התוצאות קוצצו ל-10,000 הרשומות הראשונות</span>
    </div>
  }

  <!-- Toolbar: search + export -->
  <div class="table-toolbar">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>חיפוש בתוצאות</mat-label>
      <input matInput [ngModel]="searchText()" (ngModelChange)="searchText.set($event)" aria-label="חיפוש בתוצאות" />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <button mat-stroked-button color="primary" (click)="exportCsv()" class="export-btn">
      <mat-icon>download</mat-icon>
      ייצא CSV
    </button>
  </div>

  <!-- Data table -->
  <div class="mat-elevation-z2 table-scroll">
    <table mat-table [dataSource]="filteredRows()" class="results-mat-table" aria-label="טבלת תוצאות">

      @for (col of columnNames(); track col) {
        <ng-container [matColumnDef]="col">
          <th mat-header-cell *matHeaderCellDef (click)="toggleSort(col)" class="sortable-header" [attr.aria-sort]="sortColumn() === col ? sortDirection() : 'none'">
            <span>{{ col }}</span>
            @if (sortColumn() === col) {
              <mat-icon class="sort-icon">{{ sortDirection() === 'asc' ? 'arrow_upward' : 'arrow_downward' }}</mat-icon>
            }
          </th>
          <td mat-cell *matCellDef="let row">{{ row[col] }}</td>
        </ng-container>
      }

      <tr mat-header-row *matHeaderRowDef="columnNames()"></tr>
      <tr mat-row *matRowDef="let row; columns: columnNames()"></tr>

    </table>
  </div>

  <!-- Paginator -->
  <mat-paginator
    [length]="filteredTotal()"
    [pageSize]="100"
    [pageIndex]="currentPage() - 1"
    [hidePageSize]="true"
    (page)="onPage($event)"
    aria-label="דפדוף בין תוצאות">
  </mat-paginator>

</div>
