<section class="panel" aria-labelledby="fields-heading">
  <h2 id="fields-heading" class="panel-title">שדות — {{ title() }}</h2>
  @if (fields().length === 0) {
    <p class="empty-state" role="status">טוען שדות…</p>
  } @else {
    <table mat-table [dataSource]="fields()" class="admin-table">
      <ng-container matColumnDef="friendlyName">
        <th mat-header-cell *matHeaderCellDef scope="col">שם עסקי</th>
        <td mat-cell *matCellDef="let f">{{ f.friendlyName }}</td>
      </ng-container>
      <ng-container matColumnDef="columnName">
        <th mat-header-cell *matHeaderCellDef scope="col">עמודה</th>
        <td mat-cell *matCellDef="let f" class="technical">{{ f.columnName }}</td>
      </ng-container>
      <ng-container matColumnDef="dataType">
        <th mat-header-cell *matHeaderCellDef scope="col">סוג</th>
        <td mat-cell *matCellDef="let f">{{ f.dataType }}</td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let r; columns: columns;"></tr>
    </table>
  }
</section>
