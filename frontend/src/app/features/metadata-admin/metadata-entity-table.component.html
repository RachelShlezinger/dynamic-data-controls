<section class="panel" aria-labelledby="entities-heading">
  <h2 id="entities-heading" class="panel-title">ישויות עסקיות</h2>
  @if (entities().length === 0) {
    <p class="empty-state" role="status">לא הוגדרו ישויות</p>
  } @else {
    <table mat-table [dataSource]="entities()" class="admin-table">
      <ng-container matColumnDef="friendlyName">
        <th mat-header-cell *matHeaderCellDef scope="col">שם עסקי</th>
        <td mat-cell *matCellDef="let e">{{ e.friendlyName }}</td>
      </ng-container>
      <ng-container matColumnDef="tableName">
        <th mat-header-cell *matHeaderCellDef scope="col">טבלה</th>
        <td mat-cell *matCellDef="let e" class="technical">{{ e.tableName }}</td>
      </ng-container>
      <ng-container matColumnDef="fieldCount">
        <th mat-header-cell *matHeaderCellDef scope="col">שדות</th>
        <td mat-cell *matCellDef="let e">{{ e.fields?.length ?? '—' }}</td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef scope="col">פעולות</th>
        <td mat-cell *matCellDef="let e">
          <button mat-button color="primary"
                  (click)="selectEntity.emit(e.id)"
                  [attr.aria-label]="'הצג שדות של ' + e.friendlyName"
                  matTooltip="הצג שדות">
            <mat-icon>list</mat-icon> הצג שדות
          </button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let r; columns: columns;"
          [class.selected-row]="r.id === selectedId()"></tr>
    </table>
  }
</section>
