<div dir="rtl" class="form-host">
  <mat-toolbar color="primary">
    <button mat-icon-button type="button" (click)="cancel()" aria-label="חזור לרשימה">
      <mat-icon>arrow_forward</mat-icon>
    </button>
    <span class="toolbar-title">
      {{ isEditMode() ? 'עריכת בקרה: ' + name() : 'בקרה חדשה' }}
    </span>
  </mat-toolbar>

  <div class="form-content">
    @if (isLoading()) {
      <div class="spinner-wrap" role="status" aria-label="טוען נתוני בקרה">
        <mat-spinner diameter="48" />
      </div>
    } @else {
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>שם הבקרה</mat-label>
        <input matInput [value]="name()" (input)="name.set($any($event.target).value)"
               maxlength="100" required aria-required="true" />
        @if (nameError()) {
          <mat-error>{{ nameError() }}</mat-error>
        }
        <mat-hint align="end">{{ name().length }}/100</mat-hint>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>תיאור (אופציונלי)</mat-label>
        <textarea matInput [value]="description()"
                  (input)="description.set($any($event.target).value)"
                  rows="3" maxlength="500"></textarea>
        <mat-hint align="end">{{ description().length }}/500</mat-hint>
      </mat-form-field>

      <section class="conditions-section" aria-label="תנאי הבקרה">
        <h3 class="section-title">תנאי הבקרה</h3>
        <app-condition-builder [(definition)]="definition" />
      </section>

      <div class="actions" role="group" aria-label="פעולות טופס">
        <button mat-raised-button color="primary" type="button"
                (click)="save()" [disabled]="isSaving()">
          {{ isSaving() ? 'שומר...' : 'שמור בקרה' }}
        </button>
        <button mat-stroked-button type="button" (click)="cancel()">ביטול</button>
      </div>
    }
  </div>
</div>
